version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: notesuser
      DB_PASSWORD: notespwd
      DB_NAME: notesdb
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: notespwd
      POSTGRES_DB: notesdb
    ports:
      - "5432:5432"
    volumes:
      - notes_pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  notes_pg_data:
